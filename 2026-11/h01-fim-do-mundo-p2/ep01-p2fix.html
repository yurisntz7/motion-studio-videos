<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O que você faria se o mundo acabasse hoje?</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>

<body>
<canvas id="c" width="1080" height="1920" aria-label="Episódio 1 animado"></canvas>
<div class="bar"><button id="b">Tocar episódio</button><button id="up">Carregar narração (MP3/WAV)</button><button id="cp">Copiar texto da narração</button><select id="v" aria-label="Voz do narrador"></select><input type="file" id="f" accept="audio/*" hidden></div>
<p id="n">Escolha a voz mais natural da lista (nomes com Natural, Neural ou Online costumam soar melhor).</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=360,H=640,F='"Archivo Black",Impact,sans-serif';
const C={night:'#14183A',vio:'#5B4BD6',org:'#FF7A3D',amb:'#FFC46B',ice:'#F4F6FB',skin:'#D99A6C',skin2:'#BE8156'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sg=(t,a,b)=>cl((t-a)/(b-a)),eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,lerp=(a,b,k)=>a+(b-a)*k;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)},Ci=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
const sky=(a,b)=>{const l=g.createLinearGradient(0,0,0,H);l.addColorStop(0,a);l.addColorStop(1,b);g.fillStyle=l;g.fillRect(0,0,W,H)};
const city=(off,col,base,sp)=>{g.fillStyle=col;for(let i=0;i<10;i++){const x=((i*46-off*sp)%460+460)%460-50,h=70+((i*37+11)%80);g.fillRect(x,base-h,38,h)}};
const stars=Array.from({length:60},(_,i)=>[(i*97.3)%W,(i*53.7)%300,.6+(i%3)*.5,i*.7]);

const OL='#2b1840';
const rr=(x,y,w,h,r,f,lw=2)=>{g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(lw){g.lineWidth=lw;g.lineJoin='round';g.strokeStyle=OL;g.stroke()}};
const ci=(x,y,r,f,lw=2)=>{g.beginPath();g.arc(x,y,Math.max(0,r),0,7);if(f){g.fillStyle=f;g.fill()}if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke()}};
const el=(x,y,a,b,f,lw=2,rot=0)=>{g.beginPath();g.ellipse(x,y,Math.max(.01,a),Math.max(.01,b),rot,0,7);if(f){g.fillStyle=f;g.fill()}if(lw){g.lineWidth=lw;g.strokeStyle=OL;g.stroke()}};
const pg=(pts,f,lw=2)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(f){g.fillStyle=f;g.fill()}if(lw){g.lineWidth=lw;g.lineJoin='round';g.strokeStyle=OL;g.stroke()}};
const ln=(x1,y1,x2,y2,w,c)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineWidth=w;g.strokeStyle=c;g.lineCap='round';g.stroke()};
function tx(s,x,y,sz,f,o={}){g.save();g.font=sz+'px '+F;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.translate(x,y);if(o.rot)g.rotate(o.rot);const lw=o.lw===undefined?sz*.24:o.lw;if(lw){g.lineWidth=lw;g.strokeStyle=o.sc||OL;g.strokeText(s,0,0)}g.fillStyle=f;g.fillText(s,0,0);g.restore()}
const pop=(p,a,d=.05)=>{const k=cl((p-a)/d);return k<=0?0:1+2.7*Math.pow(k-1,3)+1.7*Math.pow(k-1,2)};
const pops=(z,x,y,fn)=>{if(z<=.01)return;g.save();g.translate(x,y);g.scale(z,z);fn();g.restore()};
const hsh=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const pill=(s,x,y,sz,bg,fg='#fff')=>{g.font=sz+'px '+F;const w=g.measureText(s).width+sz*1.2;rr(x-w/2,y-sz*.85,w,sz*1.7,sz*.85,bg,2.4);tx(s,x,y+1,sz,fg,{lw:0})};

function ik(x0,y0,tx_,ty_,l1,l2,sgn){let dx=tx_-x0,dy=ty_-y0,d=Math.hypot(dx,dy)||.001;const m=l1+l2-.6;let kx=tx_,ky=ty_;if(d>m){dx*=m/d;dy*=m/d;d=m;kx=x0+dx;ky=y0+dy}
  const a=Math.atan2(dy,dx),b=Math.acos(cl((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));let best=null;
  for(const s of[-1,1]){const ex=x0+Math.cos(a+s*b)*l1,ey=y0+Math.sin(a+s*b)*l1;if(!best||sgn*ex>sgn*best[0])best=[ex,ey]}
  return[[x0,y0],best,[kx,ky]]}
function limb(pts,w,col){g.lineCap='round';g.lineJoin='round';g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.strokeStyle=OL;g.lineWidth=w+4.4;g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke()}

function hairBack(o){
  if(o.hs==='bun'){ci(0,-27,10,o.hair,2);}
  if(o.hs==='long'){rr(-25,-16,50,48,16,o.hair,2)}
}
function hairFront(o){
  const h=o.hair;
  if(o.hs==='curly'){const n=[[-20,-8],[-22,-17],[-15,-25],[-6,-29],[5,-29],[15,-25],[22,-17],[20,-8],[0,-31]];
    n.forEach(c=>{g.beginPath();g.arc(c[0],c[1],8.5,0,7);g.lineWidth=4.4;g.strokeStyle=OL;g.stroke()});
    n.forEach(c=>{g.beginPath();g.arc(c[0],c[1],8.5,0,7);g.fillStyle=h;g.fill()});
    g.beginPath();g.ellipse(0,-13,22,12,0,0,7);g.fillStyle=h;g.fill();
    ci(-8,-27,2.2,'#ffffff55',0)}
  else if(o.hs==='short'||o.hs==='long'){g.beginPath();g.moveTo(-24,-2);g.bezierCurveTo(-30,-34,30,-34,24,-2);g.lineTo(16,-12);g.lineTo(6,-19);g.lineTo(-6,-13);g.lineTo(-16,-17);g.closePath();g.fillStyle=h;g.fill();g.lineWidth=2;g.strokeStyle=OL;g.lineJoin='round';g.stroke()}
  else if(o.hs==='bun'){g.beginPath();g.moveTo(-23,-3);g.bezierCurveTo(-28,-32,28,-32,23,-3);g.bezierCurveTo(14,-14,-14,-14,-23,-3);g.fillStyle=h;g.fill();g.lineWidth=2;g.strokeStyle=OL;g.stroke()}
  else if(o.hs==='bald'){ci(-23,-1,5,h,2);ci(23,-1,5,h,2)}
  else if(o.hs==='cap'){g.beginPath();g.moveTo(-24,-6);g.bezierCurveTo(-26,-36,26,-36,24,-6);g.closePath();g.fillStyle=o.cap||'#2f6fc2';g.fill();g.lineWidth=2;g.strokeStyle=OL;g.stroke();rr(-6,-12,34,7,3.5,o.cap||'#2f6fc2',2);ci(0,-30,3,'#fff',1.4)}
}
function face(o,t){
  const bl=o.closed||(t%4.1>3.95),k=bl?.1:1,lk=o.look;
  for(const sx of[-1,1]){const ex=sx*10.4;
    if(bl){g.beginPath();g.arc(ex,-1,6.2,.1*Math.PI,.9*Math.PI);g.lineWidth=2.2;g.strokeStyle=OL;g.lineCap='round';g.stroke()}
    else{el(ex,0,7.6,8.6*k,'#fff',1.9);const ix=ex+lk[0]*2.4,iy=lk[1]*2.8;ci(ix,iy,5.6,o.iris||'#5a3b2a',0);ci(ix,iy,3,OL,0);ci(ix-1.9,iy-2.2,2,'#fff',0);ci(ix+1.6,iy+1.8,.9,'#fff',0)}
    const bt=o.brow,iy=bt===1?-18:bt===-1?-11:bt===2?-18:-14,oy=bt===1?-12.5:bt===-1?-16.5:bt===2?-18:-14.5;
    if(!o.nobrow)ln(ex-sx*6,iy,ex+sx*6,oy,2.6,o.brc||OL)}
  el(-16.5,9.5,4.4,3.1,'#ff7e8e77',0);el(16.5,9.5,4.4,3.1,'#ff7e8e77',0);
  g.beginPath();g.arc(0,6,2.2,.15*Math.PI,.85*Math.PI);g.lineWidth=1.4;g.strokeStyle='#00000040';g.stroke();
  const m=o.mouth,tk=o.talk?Math.abs(Math.sin(t*11))*3:0;g.lineCap='round';
  if(m==='smile'){g.beginPath();g.arc(0,9.5,7.5,.18*Math.PI,.82*Math.PI);g.lineWidth=2.2;g.strokeStyle=OL;g.stroke()}
  else if(m==='grin'){g.beginPath();g.moveTo(-8,12);g.quadraticCurveTo(0,26,8,12);g.closePath();g.fillStyle='#7a1f33';g.fill();g.lineWidth=2;g.strokeStyle=OL;g.stroke();g.beginPath();g.moveTo(-6.5,12.5);g.lineTo(6.5,12.5);g.lineTo(5,15);g.lineTo(-5,15);g.fillStyle='#fff';g.fill()}
  else if(m==='o'){el(0,15,4+tk*.3,5.5+tk,'#7a1f33',2)}
  else if(m==='open'){g.beginPath();g.moveTo(-8,12);g.quadraticCurveTo(0,28+tk,8,12);g.closePath();g.fillStyle='#7a1f33';g.fill();g.lineWidth=2;g.strokeStyle=OL;g.stroke();el(0,19,4,2.4,'#ff7e8e',0)}
  else if(m==='sad'){g.beginPath();g.arc(0,21,7,1.2*Math.PI,1.8*Math.PI);g.lineWidth=2.2;g.strokeStyle=OL;g.stroke()}
  else if(m==='grit'){rr(-8,12,16,8,3,'#fff',2);for(let i=-1;i<=1;i++)ln(i*4,12,i*4,20,1.2,OL);ln(-8,16,8,16,1.2,OL)}
  else{ln(-5,15,5,15,2.2,OL)}
  if(o.tear){for(const sx of[-1,1]){const q=((t*1.4+(sx>0?.5:0))%1);el(sx*11,6+q*20,2.2,3.2,'#8fd3ff',1.2)}}
  if(o.sweat){const q=(t*1.3)%1;el(21,-8+q*16,2.2,3.5,'#8fd3ff',1.2)}
}
// Personagem: (x,y)=pés, s=escala (1 ≈ 125 unidades de altura)
function P(x,y,s,o){
  o=Object.assign({skin:'#f2b58d',hair:'#2b1840',hs:'curly',top:'#ff7a3d',pants:'#35508f',shoe:'#fff',mode:'idle',t:0,face:1,mouth:'smile',brow:0,look:[0,0],w:1,rot:0,tilt:0,lean:0},o);
  const t=o.t,m=o.mode,ph=m==='run'?t*13:m==='walk'?t*8:0;
  const lean=o.lean+(m==='run'?.2:0),bob=m==='run'?-Math.abs(Math.cos(ph))*4:m==='walk'?-Math.abs(Math.cos(ph))*1.6:Math.sin(t*2.2)*.7;
  g.save();g.translate(x,y);g.rotate(o.rot);g.scale(s*o.face,s);g.translate(0,bob);g.translate(0,-40);g.rotate(lean);g.translate(0,40);
  const W2=o.w;
  // pernas
  const legs=[];for(let i=0;i<2;i++){const hx=i?7:-7,pi=ph+i*Math.PI;let fx,fy;
    if(m==='run'){fx=hx+Math.sin(pi)*24;fy=-Math.max(0,Math.cos(pi))*17}
    else if(m==='walk'){fx=hx+Math.sin(pi)*13;fy=-Math.max(0,Math.cos(pi))*7}
    else{fx=hx*1.3;fy=0}
    if(o.feet){fx=o.feet[i][0];fy=o.feet[i][1]}
    legs.push([ik(hx,-40,fx,fy-3.5,20,21,1),fx,fy])}
  if(o.sit){for(let i=0;i<2;i++){const hx=i?7:-7,kx=hx*2.2,fx=hx*2.4;limb([[hx,-40],[kx,-33],[fx,-6]],o.dress?8:9.5,o.dress?o.skin:o.pants);el(fx+3,-3,9.5,5.2,o.shoe,2)}}
  else for(const [lp,fx,fy] of legs){limb(lp,o.dress?7:9,o.dress?o.skin:o.pants);el(fx+3,fy-2.5,9.5,5.2,o.shoe,2)}
  const ul=o.ulean||0;g.translate(0,-40);g.rotate(ul);g.translate(0,40);
  if(o.dress)pg([[-17*W2,-64],[17*W2,-64],[28*W2,-20],[-28*W2,-20]],o.dress,2);
  // braços (atrás)
  const arms=[];for(let i=0;i<2;i++){const sx=i?1:-1,shx=sx*14*W2,shy=-76;let hx,hy;
    if(o.hands&&o.hands[i]){hx=o.hands[i][0];hy=o.hands[i][1];if(ul){const dx=hx,dy=hy+40;hx=dx*Math.cos(ul)+dy*Math.sin(ul);hy=-dx*Math.sin(ul)+dy*Math.cos(ul)-40}}
    else if(m==='run'){const pi=ph+(i?0:Math.PI);hx=shx+Math.sin(pi)*18+4;hy=-62+Math.cos(pi)*6}
    else if(m==='walk'){const pi=ph+(i?0:Math.PI);hx=shx+Math.sin(pi)*10;hy=-48}
    else{hx=shx+sx*6+Math.sin(t*2+i)*1.2;hy=-48+Math.sin(t*2.2+i)}
    arms.push(ik(shx,shy,hx,hy,19,19,sx))}
  const drawArm=a=>{limb(a,8,o.longSleeve?o.top:o.skin);if(!o.longSleeve){const e=a[1],s0=a[0];limb([s0,[lerp(s0[0],e[0],.6),lerp(s0[1],e[1],.6)]],9,o.top)}ci(a[2][0],a[2][1],4.6,o.skin,2)};
  drawArm(arms[0]);
  // tronco
  rr(-17*W2,-82,34*W2,45,15,o.top,2);
  if(o.stripe){g.save();g.beginPath();g.roundRect(-17*W2,-82,34*W2,45,15);g.clip();for(let yy=-72;yy<-40;yy+=11)R(-20*W2,yy,40*W2,5,o.stripe);g.restore();rr(-17*W2,-82,34*W2,45,15,null,2)}
  if(o.apron){rr(-11*W2,-70,22*W2,34,8,o.apron,2)}
  if(o.tie){pg([[-3,-80],[3,-80],[4,-72],[0,-52],[-4,-72]],o.tie,1.6)}
  if(o.collar){pg([[-9,-82],[0,-72],[-3,-82]],'#fff',1.6);pg([[9,-82],[0,-72],[3,-82]],'#fff',1.6)}
  if(o.belly){/* barriga */}
  drawArm(arms[1]);
  if(o.item)o.item();
  // cabeça
  g.save();g.translate(0,-103);g.rotate(o.tilt);
  hairBack(o);
  el(-23,2,4.6,5.6,o.skin,2);el(23,2,4.6,5.6,o.skin,2);
  el(0,0,23.5,22.5,o.skin,2.2);
  face(o,t);
  if(o.stache){g.beginPath();g.ellipse(-5,10,6,3.2,.3,0,7);g.ellipse(5,10,6,3.2,-.3,0,7);g.fillStyle=o.hair==='#ffffff'?'#ddd':'#3b2a22';g.fill();g.lineWidth=1.6;g.strokeStyle=OL;g.stroke()}
  hairFront(o);
  if(o.glasses){for(const sx of[-1,1])ci(sx*10.4,0,9.6,'#ffffff22',1.8);ln(-1,-1,1,-1,1.8,OL)}
  g.restore();
  g.restore();
}

// ---------- cenários ----------
const tl=(s,x,y,sz,col,al='left')=>{g.save();g.font=sz+'px '+F;g.textAlign=al;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y);g.restore()};
function clk(x,y,r,h,m){ci(x,y,r,'#fff',2.4);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ln(x+Math.sin(a)*r*.82,y-Math.cos(a)*r*.82,x+Math.sin(a)*r*.7,y-Math.cos(a)*r*.7,1.6,OL)}
  const ah=(h%12+m/60)/12*Math.PI*2,am=m/60*Math.PI*2;ln(x,y,x+Math.sin(ah)*r*.5,y-Math.cos(ah)*r*.5,3,OL);ln(x,y,x+Math.sin(am)*r*.75,y-Math.cos(am)*r*.75,2,OL);ci(x,y,2,'#e63946',0)}
function clouds(t,y=70){g.fillStyle='rgba(255,255,255,.93)';for(let i=0;i<4;i++){const x=((i*150+t*5)%560)-100,yy=y+(i%2)*46+i*8;[[0,0,16],[18,-8,20],[40,0,15],[20,5,17]].forEach(c=>{g.beginPath();g.arc(x+c[0],yy+c[1],c[2],0,7);g.fill()})}}
function skyDay(t,a='#62c3ff',b='#e3f6ff'){sky(a,b);clouds(t)}
function houses(off,base,sc=1){
  const cols=['#ff8a5c','#ffd166','#4cc9b0','#a98bf0','#ef6f8e','#7bc96f','#5aa9ff'],roof=['#c2482b','#d99a1f','#2a8f7c','#6a49c2','#b8405f','#4c9a3f','#2f6fc2'];
  const w=76*sc,tot=w*8,bw=w-8*sc;
  for(let i=0;i<9;i++){const x=(((i*w-off)%tot)+tot)%tot-w,h=(88+(i*37%34))*sc,c=i%7;
    ci(x+bw+4*sc,base-14*sc,14*sc,'#58b85a',2);
    rr(x,base-h,bw,h,3,cols[c]);
    pg([[x-5*sc,base-h+2],[x+bw/2,base-h-32*sc],[x+bw+5*sc,base-h+2]],roof[c]);
    for(let r=0;r<2;r++)for(let q=0;q<2;q++)rr(x+9*sc+q*28*sc,base-h+14*sc+r*32*sc,16*sc,20*sc,2,'#fff3b8',1.8);
    rr(x+bw/2-8*sc,base-24*sc,16*sc,24*sc,3,'#7a4a2e',1.8)}
}
function street(off,y0=440){
  R(0,y0,W,H-y0,'#e9dfcf');R(0,y0+50,W,H,'#656a88');ln(0,y0+50,W,y0+50,3,OL);ln(0,y0,W,y0,3,OL);
  for(let i=-1;i<8;i++){const x=((i*64-off)%512+512)%512-64;ln(x,y0,x-8,y0+50,1.4,'#00000022');R(x,y0+100,34,5,'#ffe27a')}
}
function store(t,cx){
  R(0,0,W,H,'#82dccf');const sh=(cx*.3)%46;for(let i=-1;i<9;i++)R(i*46-sh,0,22,470,'#76d0c2');
  R(0,0,W,26,'#ff8a5c');ln(0,26,W,26,2.4,OL);
  for(let i=0;i<3;i++){const x=60+i*120;ln(x,26,x,44,2,OL);el(x,50,18,9,'#fff2a8',2)}
  R(0,470,W,170,'#f2e6cc');const fs=(cx*.9)%120;for(let i=-1;i<7;i++)for(let j=0;j<4;j++)if((i+j)%2===0)R(i*60-fs,476+j*41,60,41,'#e4d1aa');
  R(0,462,W,16,'#c99b64');ln(0,462,W,462,2.4,OL);ln(0,478,W,478,2,OL);
  const cols=['#ff7a3d','#4cc9b0','#a98bf0','#ffd166','#5aa9ff','#ef6f8e'];
  for(let k=-1;k<3;k++){const x=(((k*190-cx*.6)%570)+570)%570-120;rr(x,210,150,252,6,'#d9a066');
    for(let r=0;r<3;r++){const y=290+r*57;rr(x+6,y,138,7,2,'#b9763f',1.6);
      for(let q=0;q<5;q++){const idx=k*20+r*5+q+60,bh=24+hsh(idx)*20,bw2=20+hsh(idx+9)*6;
        if(r===0&&q%2===0){rr(x+10+q*26,y-26,24,22,3,'#2b2f3e',1.6);rr(x+13+q*26,y-23,18,14,2,'#7ec8ff',0)}
        else rr(x+10+q*26,y-bh,bw2,bh,3,cols[(idx*3)%6],1.8)}}}
}
